name: Enrich from TMDB

on:
  push:
    branches: [main]
    paths: ["data/library.json", "data/overrides.json", "scripts/enrich.mjs"]
  schedule:
    - cron: "17 3 * * 1"      # weekly refresh of airing shows
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch everything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from TMDB
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node scripts/enrich.mjs ${{ inputs.force && '--force' || '' }}
      - name: Commit results
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add data/tmdb.json data/episodes.json
          git diff --staged --quiet || (git commit -m "Update TMDB data" && git pull --rebase && git push)
