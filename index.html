<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playable Thoughts · The Archive</title>
<meta name="description" content="Everything I've watched: films, shows and anime.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='9' cy='16' r='3' fill='%23000'/%3E%3Ccircle cx='16.5' cy='16' r='4.5' fill='%23000'/%3E%3Ccircle cx='25' cy='16' r='6' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--panel:#f5f5f5;--raised:#ececec;--line:#dcdcdc;--muted:#6b6b6b;--amber:#0a0a0a;--jade:#4a4a4a;--rose:#8a8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Barlow,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.cond{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em}
header{padding:22px 16px 14px;border-bottom:2px solid var(--fg)}
.logo{display:block;width:min(100%,340px);height:auto;margin:0 0 14px -4px}
.title-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
h1{margin:0;font:700 22px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase}
.count{font-size:10px;color:var(--muted)}
.dots{display:flex;align-items:center;gap:3px;height:34px;overflow:hidden}
.dots i{display:block;flex-shrink:0;border-radius:50%;background:var(--fg);cursor:pointer}
.dots i.nf{opacity:.35}
.bar{padding:12px 16px;border-bottom:1px solid var(--line)}
input[type=search]{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--fg);border-radius:0;padding:9px 12px;font:500 15px Barlow,sans-serif}
input[type=search]:focus{outline:none;box-shadow:3px 3px 0 var(--fg)}
.tabs{display:flex;gap:2px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{padding:6px 12px;border:1px solid transparent;color:var(--muted);font:600 14px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.tabs button.on{background:var(--fg);color:var(--bg)}
.sortrow{display:flex;justify-content:space-between;align-items:center;padding:8px 16px}
select{background:var(--bg);color:var(--fg);border:1px solid var(--fg);border-radius:0;padding:4px 8px;font:500 12px Barlow,sans-serif}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(8,1fr)}}
.tile{text-align:left;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:block;width:100%;transition:border-color .12s,box-shadow .12s}
.tile:hover,.tile:focus-visible{border-color:var(--fg);box-shadow:3px 3px 0 var(--fg);outline:none}
.cover{aspect-ratio:2/3;position:relative;background:var(--panel);overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;background:#fff}
.ph:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#0a0a0a 34%,transparent 37%) 0 0/var(--d,8px) var(--d,8px);-webkit-mask-image:linear-gradient(var(--a,200deg),#000 0%,rgba(0,0,0,.5) 35%,transparent 70%);mask-image:linear-gradient(var(--a,200deg),#000 0%,rgba(0,0,0,.5) 35%,transparent 70%)}
.ph span{position:relative;font:700 15px/1.02 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:6px;font-size:10px;background:rgba(255,255,255,.92);color:var(--fg);border-radius:99px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.tile .meta{padding:6px 8px 8px}
.tile .nm{font:600 13px/1.15 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;height:30px;overflow:hidden}
.tile .sub{display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:var(--muted)}
.more{display:block;margin:8px 12px 110px;width:calc(100% - 24px);padding:12px;background:var(--bg);border:1px solid var(--fg);font:600 14px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em}
.more:hover{background:var(--fg);color:var(--bg)}
footer{padding:0 16px 40px;font-size:10px;color:var(--muted);line-height:1.6}
.scrim{position:fixed;inset:0;background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--bg);border:2px solid var(--fg)}
@media(min-width:640px){.sheet{box-shadow:6px 6px 0 var(--fg)}}
.banner{height:120px;position:relative;overflow:hidden;background:var(--panel)}
.banner img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);opacity:.6}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,var(--bg))}
.sec{padding:16px;border-bottom:1px solid var(--line)}
.head{display:flex;gap:12px}
.head .cover{width:76px;flex-shrink:0;border:1px solid var(--line)}
.h2{font:700 26px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em;text-transform:uppercase}
.lbl{font-size:10px;color:var(--muted);line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font:600 13px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--fg);background:var(--bg);padding:4px 10px;text-decoration:none;display:inline-block}
.chip:hover{background:var(--fg);color:var(--bg)}
.chip.hot{background:var(--fg);color:var(--bg)}
.chip.hot:hover{background:var(--bg);color:var(--fg)}
.rate{display:flex;gap:5px;margin-top:6px}.rate i{flex:1;aspect-ratio:1;max-width:26px;border-radius:50%;border:1px solid var(--fg)}
.rate i.on{background:var(--fg)}
.recs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rec{width:72px;flex-shrink:0;text-align:left}
.rec .cover{border:1px solid var(--line)}
.rec.in .cover{border:2px solid var(--fg)}
.review{background:var(--panel);border-left:3px solid var(--fg);padding:8px 10px;margin-bottom:8px;font-size:13px;line-height:1.45}
.season>button{width:100%;display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font:600 14px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.ep{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13px;width:100%}
.ep .bx{width:14px;height:14px;border-radius:50%;border:1px solid var(--fg);flex-shrink:0;font-size:0}
.ep.done .bx{background:var(--fg)}.ep.done .tt{color:var(--muted)}
.ep.fut{opacity:.4}
.x{width:100%;margin-top:12px;padding:12px;background:var(--bg);border:1px solid var(--fg);font:600 14px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em}
.x:hover{background:var(--fg);color:var(--bg)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:var(--bg);border:1px solid var(--fg);padding:12px}
.card .n{font:700 40px/1 'Barlow Condensed',sans-serif}
.empty{padding:60px 16px;text-align:center;color:var(--muted);font-size:14px}

.sections{display:flex;gap:0;border-bottom:1px solid var(--fg)}
.sections button{flex:1;background:var(--bg);color:var(--fg);border:0;border-right:1px solid var(--fg);padding:11px 8px;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.sections button:last-child{border-right:0}
.sections button.on{background:var(--fg);color:var(--bg)}
.media{padding:16px;display:grid;gap:16px;max-width:1100px;margin:0 auto}
.media .frame{position:relative;border:1px solid var(--fg);background:var(--bg);box-shadow:4px 4px 0 var(--fg)}
.media .yt{aspect-ratio:16/9}
.media iframe{display:block;width:100%;height:100%;border:0}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.reels .frame{height:560px}
.cta{display:inline-block;justify-self:start;border:1px solid var(--fg);padding:9px 14px;color:var(--fg);text-decoration:none;font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.cta:hover{background:var(--fg);color:var(--bg)}
</style>
</head>
<body>
<header>
  <img class="logo" src="assets/logo.png" alt="Playable Thoughts: turning thoughts into reality">
  <div class="title-row"><h1>The Archive</h1><span class="count mono" id="count"></span></div>
  <div class="dots" id="spectrum"></div>
</header>
<div class="sections" id="sections"><button data-s="archive">Archive</button><button data-s="videos">Videos</button><button data-s="reels">Reels</button></div>
<div class="bar" id="bar"><input type="search" id="q" placeholder="Search everything" autocomplete="off"></div>
<div class="tabs" id="tabs"></div>
<div class="sortrow" id="sortrow"><span class="count mono" id="shown"></span>
  <select id="sort">
    <option value="smart">Most watched</option><option value="seq">Recently added</option>
    <option value="az">Title A–Z</option><option value="za">Title Z–A</option>
    <option value="ynew">Year, new to old</option><option value="yold">Year, old to new</option>
  </select></div>
<main id="main"></main>
<footer>Read-only view of my watch history. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IMG = "https://image.tmdb.org/t/p/";
const STATUS = ["Watching", "Finished", "Backlog", "Dropped"];
const TONE = ["var(--amber)", "var(--jade)", "var(--muted)", "var(--rose)"];
const BAND = { anime: "var(--fg)", film: "var(--rose)", tv: "var(--jade)" };
const hue = (t) => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const clean = (t) => String(t || "").replace(/<[^>]+>/g, "").replace(/[*_]{1,3}/g, "").replace(/\s+/g, " ").trim();
const shown = (i) => (i.tvdb && TM[i.id] && TM[i.id].nm) || i.title;
const norm = (t) => (t || "").toLowerCase().replace(/[^a-z0-9]+/g, "");

let LIB = [], TM = {}, EPS = null, MEDIA = null, section = "archive", tab = "continue", sortMode = "smart", limit = 60, query = "";

const TABS = [["continue", "Continue"], ["tv", "Television"], ["anime", "Anime"], ["film", "Films"], ["fav", "Favourites"], ["backlog", "Backlog"], ["stats", "Stats"]];

async function boot() {
  try {
    const j = (f) => fetch(`data/${f}?v=${Date.now() >> 16}`).then((r) => (r.ok ? r.json() : {}));
    [LIB, TM, MEDIA] = await Promise.all([j("library.json"), j("tmdb.json"), j("media.json")]);
  } catch (e) { $("#main").innerHTML = `<div class="empty">Couldn't load the archive.</div>`; return; }
  $("#sections").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; section = b.dataset.s; render(); scrollTo(0, 0); };
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button data-t="${k}">${l}</button>`).join("");
  $("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.t; query = ""; $("#q").value = ""; limit = 60; render(); };
  $("#q").oninput = (e) => { query = e.target.value; limit = 60; render(); };
  $("#sort").onchange = (e) => { sortMode = e.target.value; limit = 60; render(); };
  $("#scrim").onclick = (e) => { if (e.target.id === "scrim") closeSheet(); };
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  addEventListener("hashchange", fromHash);
  render(); fromHash();
}

function sorted(list) {
  const a = list.slice();
  const cmp = {
    smart: (x, y) => (y.type === "show" ? y.w : -1) - (x.type === "show" ? x.w : -1),
    seq: (x, y) => { const sx = x.seq || 0, sy = y.seq || 0; if (sx > 0 || sy > 0) return sy - sx; return (y.added || "").localeCompare(x.added || ""); },
    az: () => 0, za: (x, y) => y.title.localeCompare(x.title),
    ynew: (x, y) => (+y.year || 0) - (+x.year || 0),
    yold: (x, y) => (+x.year || 9999) - (+y.year || 9999),
  }[sortMode];
  return a.sort((x, y) => cmp(x, y) || x.title.localeCompare(y.title));
}
function visible() {
  let l = LIB;
  if (query.trim()) { const t = query.toLowerCase(); l = l.filter((i) => i.title.toLowerCase().includes(t) || (i.original || "").toLowerCase().includes(t)); }
  else if (tab === "continue") l = l.filter((i) => i.s === 0);
  else if (tab === "fav") l = l.filter((i) => i.f);
  else if (tab === "backlog") l = l.filter((i) => i.s === 2);
  else if (tab !== "stats") l = l.filter((i) => i.shelf === tab);
  return sorted(l);
}

function cover(i, w = "w185") {
  const m = TM[i.id];
  const h = hue(i.title), ang = [200, 160, 20, 340][h % 4], dd = 6 + (h % 4);
  const ph = `<div class="ph" style="--a:${ang}deg;--d:${dd}px"><span>${esc(shown(i))}</span></div>`;
  return m && m.p ? `${ph}<img loading="lazy" src="${IMG}${w}${m.p}" alt="" onerror="this.remove()">` : ph;
}

function mediaHtml() {
  const m = MEDIA || {};
  if (section === "videos") {
    const y = m.youtube || {}, v = m.videos || [];
    const link = `<a class="cta" href="https://www.youtube.com/@${esc(y.handle || "playablethoughts")}" target="_blank" rel="noopener">Subscribe on YouTube ↗</a>`;
    if (!v.length) return `<div class="media">${link}</div>`;
    return `<div class="media"><div class="vids">${v.map((id) => `<div class="frame yt"><iframe loading="lazy" src="https://www.youtube.com/embed/${esc(id)}" title="Playable Thoughts video" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`).join("")}</div>${link}</div><div style="height:40px"></div>`;
  }
  const r = m.reels || [];
  if (!r.length) return `<div class="empty">Nothing here yet.</div>`;
  return `<div class="media"><div class="reels">${r.map((id) => `<div class="frame"><iframe loading="lazy" src="https://www.instagram.com/reel/${esc(id)}/embed" title="Instagram reel" allowtransparency="true" scrolling="no"></iframe></div>`).join("")}</div>
    <a class="cta" href="https://www.instagram.com/${esc((m.instagram || {}).handle || "playable_thoughts")}" target="_blank" rel="noopener">Follow on Instagram ↗</a></div><div style="height:40px"></div>`;
}
function render() {
  $("#sections").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.s === section));
  const arch = section === "archive";
  $("h1").textContent = arch ? "The Archive" : section === "videos" ? "Videos" : "Reels";
  $("#bar").style.display = $("#tabs").style.display = arch ? "" : "none";
  if (!arch) { $("#sortrow").style.display = "none"; $("#count").textContent = ""; $("#main").onclick = null; $("#main").innerHTML = mediaHtml(); return; }
  $("#tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab && !query));
  $("#count").textContent = `${LIB.length} titles`;
  const spec = LIB.filter((i) => i.type === "show" && i.w > 0).sort((a, b) => b.w - a.w).slice(0, 60);
  const mxw = spec[0]?.w || 1;
  $("#spectrum").innerHTML = spec.map((i) => { const d = Math.round(4 + 28 * Math.sqrt(i.w / mxw));
    return `<i data-id="${esc(i.id)}" title="${esc(i.title)} · ${i.w} eps" style="width:${d}px;height:${d}px"></i>`; }).join("");
  $("#spectrum").onclick = (e) => { const t = e.target.closest("i"); if (t) openItem(t.dataset.id); };
  const stats = tab === "stats" && !query;
  $("#sortrow").style.display = stats ? "none" : "flex";
  $("#sort").value = sortMode;
  if (stats) { $("#main").innerHTML = statsHtml(); return; }
  const v = visible();
  $("#shown").textContent = `${v.length} shown`;
  if (!v.length) { $("#main").innerHTML = `<div class="empty">${query ? "Nothing matches that." : "Nothing on this shelf yet."}</div>`; return; }
  $("#main").innerHTML = `<div class="grid">${v.slice(0, limit).map(tile).join("")}</div>` +
    (v.length > limit ? `<button class="more" id="more">Show more · ${v.length - limit} remaining</button>` : `<div style="height:60px"></div>`);
  $("#main").onclick = (e) => {
    if (e.target.closest("#more")) { limit += 60; render(); return; }
    const t = e.target.closest(".tile"); if (t) openItem(t.dataset.id);
  };
}
function tile(i) {
  const right = i.type === "show" ? (i.w > 0 ? i.w : "") : (i.year || "");
  return `<button class="tile" data-id="${esc(i.id)}"><div class="cover">${cover(i)}
    ${i.f ? `<span class="badge" style="right:6px">★</span>` : ""}
    ${i.x > 0 ? `<span class="badge mono" style="left:6px;font-size:9px">↻${i.x}</span>` : ""}</div>
    <div class="meta"><div class="nm">${esc(shown(i))}</div><div class="sub mono"><span style="color:${i.s === 0 ? "var(--fg)" : "var(--muted)"};font-weight:${i.s === 0 ? 600 : 400}">${i.s === 0 ? "● " : ""}${STATUS[i.s]}</span><span>${right}</span></div></div></button>`;
}

function statsHtml() {
  const shows = LIB.filter((i) => i.type === "show"), films = LIB.filter((i) => i.type === "film" && i.s === 1);
  const eps = shows.reduce((a, i) => a + i.w, 0), re = films.reduce((a, i) => a + (i.x || 0), 0);
  const hours = Math.round((eps * 23 + (films.length + re) * 115) / 60);
  const top = shows.slice().sort((a, b) => b.w - a.w).slice(0, 8), mx = top[0]?.w || 1;
  return `<div class="stat">
    <div class="card"><div class="n">${films.length}</div><div class="lbl mono">FILMS</div></div>
    <div class="card"><div class="n">${shows.length}</div><div class="lbl mono">SHOWS</div></div>
    <div class="card"><div class="n">${eps.toLocaleString()}</div><div class="lbl mono">EPISODES</div></div>
    <div class="card"><div class="n">~${hours.toLocaleString()}h</div><div class="lbl mono">ESTIMATED</div></div></div>
    <div style="padding:0 16px 100px"><div class="lbl mono" style="margin-bottom:8px">MOST WATCHED</div>
    ${top.map((i) => `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:11px"><span>${esc(i.title)}</span><span class="mono" style="color:var(--muted)">${i.w}</span></div>
      <div style="height:3px;background:var(--panel);margin-top:3px"><div style="height:100%;width:${i.w / mx * 100}%;background:var(--fg)"></div></div></div>`).join("")}
    <div class="lbl" style="margin-top:12px">Hours assume 23 min an episode and 115 min a film, so they are an estimate.</div></div>`;
}

async function openItem(id) {
  const i = LIB.find((x) => x.id === id); if (!i) return;
  history.replaceState(null, "", "#" + encodeURIComponent(id));
  const m = TM[id] && !TM[id].nf ? TM[id] : null;
  const imdb = m?.im ? `https://www.imdb.com/title/${m.im}/` : `https://www.imdb.com/find/?q=${encodeURIComponent(i.original || i.title)}`;
  const lb = i.type === "film" ? (m?.t ? `https://letterboxd.com/tmdb/${m.t}` : `https://letterboxd.com/search/${encodeURIComponent(i.title)}/`) : "";
  const info = m ? [m.y, m.rt ? m.rt + " min" : "", i.type === "show" && m.ns ? `${m.ns} season${m.ns > 1 ? "s" : ""} · ${m.ne} eps` : "", m.v ? "★ " + m.v : ""].filter(Boolean).join(" · ") : "";
  $("#sheet").innerHTML = `
    ${m?.bd ? `<div class="banner"><img src="${IMG}w780${m.bd}" alt=""></div>` : ""}
    <div class="sec"><div class="head"><div class="cover">${cover(i, "w342")}</div><div style="min-width:0;flex:1">
      <div class="h2">${esc(shown(i))}</div>
      <div class="lbl mono" style="margin-top:6px">${i.shelf === "anime" ? "ANIME" : i.shelf === "film" ? "FILM" : "TELEVISION"}${i.year ? " · " + esc(i.year) : ""}${i.last ? " · left off " + esc(i.last) : ""}${i.original ? " · " + esc(i.original) : ""}</div>
      <div class="lbl mono" style="color:var(--fg)">${STATUS[i.s]}${i.f ? " · ★ favourite" : ""}${i.type === "show" ? " · " + i.w + " eps watched" : ""}${i.x > 0 ? " · rewatched " + i.x + "×" : ""}</div></div></div>
      ${i.r ? `<div class="lbl mono" style="margin-top:12px">MY RATING ${i.r}/10</div><div class="rate">${[...Array(10)].map((_, k) => `<i class="${k < i.r ? "on" : ""}"></i>`).join("")}</div>` : ""}
      ${i.n ? `<div style="margin-top:12px;font-size:14px;line-height:1.5">${esc(i.n)}</div>` : ""}</div>
    <div class="sec">
      ${m?.tg ? `<div style="font-size:14px;font-style:italic;margin-bottom:6px">${esc(m.tg)}</div>` : ""}
      ${m?.o ? `<div style="font-size:14px;line-height:1.5">${esc(m.o)}</div>` : `<div class="lbl">${m ? "" : "No TMDB details yet."}</div>`}
      <div class="lbl mono" style="margin-top:8px">${esc(info)}
        ${m?.g?.length ? `<div>${esc(m.g.join(" · "))}</div>` : ""}
        ${m?.dr?.length ? `<div>${i.type === "show" ? "Created by" : "Directed by"} ${esc(m.dr.join(", "))}</div>` : ""}
        ${m?.c?.length ? `<div>With ${esc(m.c.slice(0, 8).join(", "))}</div>` : ""}
        ${m?.wp?.length ? `<div style="color:var(--fg)">Streaming (IN): ${esc(m.wp.join(", "))}</div>` : ""}</div>
      <div class="chips">
        ${m?.tr ? `<a class="chip hot" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${esc(m.tr)}">▶ Trailer</a>` : ""}
        <a class="chip" target="_blank" rel="noopener" href="${imdb}">IMDb ↗</a>
        ${m?.t ? `<a class="chip" target="_blank" rel="noopener" href="https://www.themoviedb.org/${m.k}/${m.t}">TMDB ↗</a>` : ""}
        ${lb ? `<a class="chip" target="_blank" rel="noopener" href="${lb}">Letterboxd ↗</a>` : ""}</div></div>
    ${m?.rv?.length ? `<div class="sec"><div class="lbl mono" style="margin-bottom:6px">REVIEWS (TMDB)</div>${m.rv.slice(0, 2).map((r) => `<div class="review">${esc(clean(r.t))}${r.t.length >= 500 ? "…" : ""}<div class="lbl mono" style="margin-top:4px">${esc(r.a)}${r.r ? " · " + r.r + "/10" : ""}</div></div>`).join("")}</div>` : ""}
    ${m?.rc?.length ? `<div class="sec"><div class="lbl mono" style="margin-bottom:6px">MORE LIKE THIS</div><div class="recs">${m.rc.map((r) => {
      const hit = LIB.find((x) => x.type === (r.k === "movie" ? "film" : "show") && (norm(x.title) === norm(r.n) || norm(x.original) === norm(r.n)));
      return `<button class="rec ${hit ? "in" : ""}" ${hit ? `data-open="${esc(hit.id)}"` : "disabled"}><div class="cover">${r.p ? `<img loading="lazy" src="${IMG}w185${r.p}" alt="">` : ""}</div>
        <div style="font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.n)}</div>
        <div class="mono" style="font-size:9px;color:${hit ? "var(--jade)" : "var(--muted)"}">${hit ? "in archive" : esc(r.y)}</div></button>`;
    }).join("")}</div></div>` : ""}
    ${i.type === "show" && m?.t ? `<div class="sec" id="epsec"><button class="x" id="epbtn" style="margin-top:0">Episodes${m.ns ? " · " + m.ns + " season" + (m.ns > 1 ? "s" : "") : ""}</button><div id="eplist"></div></div>` : ""}
    <div class="sec" style="border:0"><button class="x" style="margin-top:0" id="done">Close</button></div>`;
  $("#scrim").classList.add("open"); $("#sheet").scrollTop = 0; document.body.style.overflow = "hidden";
  $("#done").onclick = closeSheet;
  $("#sheet").querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => openItem(b.dataset.open)));
  const eb = $("#epbtn"); if (eb) eb.onclick = () => showEps(i);
}
async function showEps(i) {
  const box = $("#eplist"); if (box.dataset.on) { box.innerHTML = ""; delete box.dataset.on; return; }
  box.dataset.on = 1; box.innerHTML = `<div class="lbl mono" style="margin-top:8px">Loading…</div>`;
  if (!EPS) EPS = await fetch("data/episodes.json").then((r) => r.json()).catch(() => ({}));
  const d = EPS[i.id]; if (!d) { box.innerHTML = `<div class="lbl" style="margin-top:8px">No episode list yet.</div>`; return; }
  const today = new Date().toISOString().slice(0, 10); let off = 0;
  box.innerHTML = `<div style="margin-top:8px">` + d.seasons.map((s) => {
    const start = off; off += s.eps.length;
    const seen = Math.max(0, Math.min(s.eps.length, i.w - start));
    return `<div class="season"><button data-s="${s.n}"><span>Season ${s.n}</span><span class="lbl mono" style="color:${seen === s.eps.length ? "var(--jade)" : "var(--muted)"}">${seen}/${s.eps.length} ▾</span></button><div hidden>
      ${s.eps.map(([n, name, date], k) => { const done = start + k < i.w;
        return `<div class="ep ${done ? "done" : ""} ${date && date > today ? "fut" : ""}"><span class="bx">${done ? "✓" : ""}</span><span class="lbl mono" style="width:22px">${n}</span><span class="tt" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name || "Episode " + n)}</span><span class="lbl mono">${date ? date.slice(0, 4) : ""}</span></div>`; }).join("")}</div></div>`;
  }).join("") + `</div>`;
  box.querySelectorAll(".season>button").forEach((b) => (b.onclick = () => { const p = b.nextElementSibling; p.hidden = !p.hidden; }));
}
function closeSheet() { $("#scrim").classList.remove("open"); document.body.style.overflow = ""; history.replaceState(null, "", location.pathname); }
function fromHash() { const id = decodeURIComponent(location.hash.slice(1)); if (id) openItem(id); }
boot();
</script>
</body>
